": "nationalTeam", "subtitle": "", "related": ["haaland"], "action": "none", "fact": "Erling Haaland represents Norway."}, {"id": "poland", "name": "Poland", "category": "nationalTeam", "subtitle": "", "related": ["lewandowski"], "action": "none", "fact": "Robert Lewandowski represents Poland."}, {"id": "world_cup", "name": "FIFA World Cup", "category": "competition", "subtitle": "", "related": ["argentina", "brazil", "france", "spain", "italy", "germany", "messi", "ronaldinho", "zidane", "mbappe"], "action": "none", "fact": "The FIFA World Cup is the major international national-team tournament."}, {"id": "ucl", "name": "UEFA Champions League", "category": "competition", "subtitle": "", "related": ["barcelona", "real_madrid", "juventus", "ac_milan", "inter", "bayern", "dortmund", "man_city", "liverpool", "chelsea", "man_united", "psg"], "action": "none", "fact": "The Champions League is UEFA’s premier club competition."}, {"id": "copa_america", "name": "Copa América", "category": "competition", "subtitle": "", "related": ["argentina", "brazil", "messi", "neymar"], "action": "none", "fact": "Copa América is a major South American national-team competition."}, {"id": "euro", "name": "UEFA European Championship", "category": "competition", "subtitle": "", "related": ["portugal", "france", "spain", "italy", "germany"], "action": "none", "fact": "The UEFA European Championship is contested by European national teams."}, {"id": "premier_league", "name": "Premier League", "category": "league", "subtitle": "", "related": ["man_city", "liverpool", "arsenal", "chelsea", "man_united", "tottenham", "england"], "action": "none", "fact": "The Premier League is England’s top division."}, {"id": "la_liga", "name": "La Liga", "category": "league", "subtitle": "", "related": ["barcelona", "real_madrid", "atletico", "spain"], "action": "none", "fact": "La Liga is Spain’s top division."}, {"id": "serie_a", "name": "Serie A", "category": "league", "subtitle": "", "related": ["juventus", "ac_milan", "inter", "italy"], "action": "none", "fact": "Serie A is Italy’s top division."}, {"id": "bundesliga", "name": "Bundesliga", "category": "league", "subtitle": "", "related": ["bayern", "dortmund", "germany"], "action": "none", "fact": "The Bundesliga is Germany’s top division."}, {"id": "ligue_1", "name": "Ligue 1", "category": "league", "subtitle": "", "related": ["psg", "france"], "action": "none", "fact": "Ligue 1 is France’s top division."}, {"id": "africa", "name": "Africa", "category": "continent", "subtitle": "", "related": ["egypt", "salah"], "action": "none", "fact": "Egypt and Mohamed Salah are connected to African football."}, {"id": "draw_two", "name": "+2", "category": "action", "subtitle": "Draw two", "related": [], "action": "drawTwo", "fact": ""}, {"id": "draw_four", "name": "+4", "category": "action", "subtitle": "Draw four", "related": [], "action": "drawFour", "fact": ""}, {"id": "reverse", "name": "REVERSE", "category": "action", "subtitle": "Change direction", "related": [], "action": "reverse", "fact": ""}, {"id": "skip", "name": "SKIP", "category": "action", "subtitle": "Skip next player", "related": [], "action": "skip", "fact": ""}, {"id": "wild", "name": "WILD", "category": "action", "subtitle": "Choose category", "related": [], "action": "wild", "fact": ""}, {"id": "var_vote", "name": "VAR", "category": "action", "subtitle": "Challenge a connection", "related": [], "action": "varVote", "fact": ""}];

const allCards=[...baseCards,...specials];let count=2,state=null;
const $=id=>document.getElementById(id);document.querySelectorAll('[data-count]').forEach(b=>b.onclick=()=>{count=+b.dataset.count;document.querySelectorAll('[data-count]').forEach(x=>x.classList.toggle('active',x===b))});
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function startGame(){let deck=shuffle([...allCards]);state={players:Array.from({length:count},(_,i)=>({name:`اللاعب ${i+1}`,hand:[]})),deck,discard:[],turn:0,direction:1,winner:null,explain:''};for(let n=0;n<7;n++)state.players.forEach(p=>p.hand.push(drawOne()));let first=drawOne();while(first.action!=='none'&&first.action){state.deck.unshift(first);first=drawOne()}state.discard.push(first);$('setup').classList.add('hidden');$('game').classList.remove('hidden');render()}
function drawOne(){if(!state.deck.length&&state.discard.length>1){let top=state.discard.pop();state.deck=shuffle(state.discard);state.discard=[top]}return state.deck.pop()}
function active(){return state.players[state.turn]}function canPlay(c){let top=state.discard.at(-1);return c.action&&c.action!=='none'||top.related.includes(c.id)||c.related.includes(top.id)}
function advance(){state.turn=(state.turn+state.direction+state.players.length)%state.players.length}
function draw(n=1){for(let i=0;i<n;i++){if(state.deck.length||state.discard.length>1)active().hand.push(drawOne())}}
function play(id){let p=active(),idx=p.hand.findIndex(c=>c.id===id),c=p.hand[idx];if(!c||!canPlay(c))return; p.hand.splice(idx,1);state.discard.push(c);state.explain=c.fact||c.subtitle||'';
switch(c.action){case'reverse':state.direction*=-1;advance();break;case'skip':advance();advance();break;case'drawTwo':advance();draw(2);advance();break;case'drawFour':advance();draw(4);advance();break;case'varVote':state.explain='بطاقة VAR: تم قبول التحدي في هذه النسخة التجريبية.';advance();break;default:advance()}
if(!p.hand.length){state.winner=p.name;render();$('modal-title').textContent='🏆 انتهت المباراة!';$('modal-text').textContent=`${p.name} فاز بالمباراة!`; $('modal').classList.remove('hidden');return}render()}
function cardHTML(c,small=false,disabled=false){let symbol=c.category==='club'?'⚽':c.category==='player'?'👤':c.category==='action'?'⚡':c.category==='manager'?'🧠':'🏆';return `<div class="card cat-${c.category} ${disabled?'disabled':''}" ${small?`data-card="${c.id}"`:''}><div class="cat">${c.category}</div><div class="symbol">${symbol}</div><div><div class="name">${c.name}</div><div class="sub">${c.subtitle||''}</div></div></div>`}
function render(){$('players').innerHTML=state.players.map((p,i)=>`<div class="player ${i===state.turn?'active':''}"><b>${p.name}</b><div class="small">${p.hand.length} أوراق</div></div>`).join('');$('topcard').innerHTML=cardHTML(state.discard.at(-1));$('explain').textContent=state.explain;$('direction').textContent=`الاتجاه: ${state.direction===1?'مع عقارب الساعة':'عكس عقارب الساعة'}`;$('turn').textContent=active().name;$('countcards').textContent=`لديك ${active().hand.length} أوراق`;$('hand').innerHTML=active().hand.map(c=>cardHTML(c,true,!canPlay(c))).join('');$('hand').querySelectorAll('[data-card]').forEach(el=>{let c=active().hand.find(x=>x.id===el.dataset.card);el.onclick=()=>{if(canPlay(c))play(c.id);else $('message').textContent='هذه البطاقة لا ترتبط بالبطاقة الحالية.'}});$('message').textContent=''}
