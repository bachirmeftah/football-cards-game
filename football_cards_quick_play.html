<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Football Cards</title><script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script><style>
*{box-sizing:border-box}body{margin:0;background:#07130f;color:#fff;font-family:Arial,system-ui}header{text-align:center;padding:18px;border-bottom:1px solid #345}h1{color:#c7f36b;margin:0}main{max-width:700px;margin:auto;padding:14px}.box{background:#10251c;border:1px solid #345;border-radius:16px;padding:15px;margin:12px 0}button,input{font:inherit;padding:12px;border-radius:11px;border:0;margin:4px}button{background:#c7f36b;color:#102016;font-weight:bold}input{background:#07130f;color:white;border:1px solid #567;width:100%}.row{display:flex;gap:8px}.row>*{flex:1}.muted{color:#b3c4ba}.code{color:#c7f36b;overflow-wrap:anywhere}.cards{display:flex;gap:8px;overflow:auto}.card{background:#fff;color:#18251e;border-radius:13px;min-width:105px;height:145px;padding:9px;display:flex;flex-direction:column;justify-content:space-between;text-align:center}.emoji{font-size:32px}.card button{padding:7px}.hidden{display:none}.pill{display:inline-block;background:#234332;padding:8px;border-radius:9px;margin:3px}
</style><header><h1>⚽ FOOTBALL CARDS</h1><small>العب مع أصدقائك من هواتف مختلفة</small></header><main>
<section id="lobby" class="box"><h3>ابدأ اللعب</h3><div class="row"><button onclick="host()">إنشاء غرفة</button><button onclick="document.getElementById('join').classList.remove('hidden')">دخول غرفة</button></div><div id="hostarea" class="hidden"><p>أرسل هذا الرمز الكامل لصديقك:</p><b id="mycode" class="code"></b><p class="muted">انتظر اتصال صديقك ثم اضغط بدء.</p><button onclick="start()">بدء اللعبة</button></div><div id="join" class="hidden"><input id="code" placeholder="الصق رمز المضيف هنا"><button onclick="join()">اتصال</button></div><p id="status" class="muted">يحتاج الهاتفان إلى الإنترنت. هذه نسخة تجريبية لشخصين.</p></section>
<section id="game" class="hidden"><div class="box"><div id="players"></div><p id="notice"></p></div><div class="box"><h3>البطاقة الحالية</h3><div id="top"></div><p class="muted">اشرح العلاقة شفهيًا بينك وبين أصدقائك.</p></div><div class="box"><h3>بطاقاتك</h3><div id="hand" class="cards"></div><div class="row"><button onclick="action('draw')">اسحب ورقة</button><button onclick="action('pass')">مرّر الدور</button></div></div><div class="box"><h3>📺 VAR</h3><p class="muted">ناقشوا العلاقة، ثم اختاروا النتيجة.</p><button onclick="action('var')">طلب VAR</button><div id="var" class="hidden"><div class="row"><button onclick="action('correct')">العلاقة صحيحة</button><button onclick="action('wrong')">العلاقة خاطئة</button></div></div></div></section>
</main><script>
const D=[['كأس العالم','🏆','بطولة'],['فرنسا','🇫🇷','منتخب'],['البرازيل','🇧🇷','منتخب'],['الأرجنتين','🇦🇷','منتخب'],['ألمانيا','🇩🇪','منتخب'],['إسبانيا','🇪🇸','منتخب'],['إيطاليا','🇮🇹','منتخب'],['ريال مدريد','⚪','نادٍ'],['برشلونة','🔵🔴','نادٍ'],['مانشستر يونايتد','🔴','نادٍ'],['مانشستر سيتي','🔵','نادٍ'],['ليفربول','🔴','نادٍ'],['بايرن ميونخ','🔴⚪','نادٍ'],['باريس','🔵🔴','نادٍ'],['دوري الأبطال','⭐','بطولة'],['الدوري الإنجليزي','🏴','بطولة'],['رونالدو','🐐','لاعب'],['ميسي','🐐','لاعب'],['مبابي','⚡','لاعب'],['نيمار','🇧🇷','لاعب'],['زيدان','🎩','لاعب'],['رونالدينيو','😁','لاعب'],['بيليه','👑','لاعب'],['مارادونا','🌟','لاعب'],['محمد صلاح','🇪🇬','لاعب'],['هالاند','🤖','لاعب'],['مودريتش','🎯','لاعب'],['كأس إفريقيا','🌍','بطولة'],['الكرة الذهبية','🥇','جائزة'],['كأس أوروبا','🏆','بطولة']];
let peer,conn,hostMode=false,S=null;
const $=x=>document.getElementById(x);
function host(){hostMode=true;peer=new Peer();peer.on('open',id=>{$('mycode').textContent=id;$('hostarea').classList.remove('hidden');$('status').textContent='الغرفة جاهزة. أرسل الرمز الكامل لصديقك.'});peer.on('connection',c=>{conn=c;c.on('open',()=>{$('status').textContent='اتصل صديقك. يمكنك بدء اللعبة.'});c.on('data',receive)});peer.on('error',e=>$('status').textContent='خطأ اتصال: '+e.type)}
function join(){let id=$('code').value.trim();if(!id)return;peer=new Peer();peer.on('open',()=>{conn=peer.connect(id);conn.on('open',()=>{$('status').textContent='تم الاتصال بالمضيف، انتظر بدء اللعبة.'});conn.on('data',receive)});peer.on('error',e=>$('status').textContent='تعذر الاتصال: '+e.type)}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function start(){if(!conn||!conn.open){$('status').textContent='انتظر اتصال صديقك.';return}let a=shuffle(D);S={hands:[a.splice(0,7),a.splice(0,7)],top:a.pop(),deck:a,turn:0,varBy:null,winner:null};sync()}
function sync(){if(conn&&conn.open)conn.send({S});drawUI()}
function receive(m){if(m.S){S=m.S;drawUI()}else if(m.act&&hostMode){apply(m.act,1)}}
function action(a){if(!S)return;if(hostMode)apply(a,0);else conn.send({act:a})}
function apply(a,p){if(a==='play'){let c=S.hands[p].splice(window.pick,1)[0];if(!c)return;S.top=c;S.turn=1-p;if(!S.hands[p].length)S.winner=p===0?'المضيف':'الصديق'}else if(a==='draw'){S.hands[p].push(S.deck.length?S.deck.pop():shuffle(D).pop())}else if(a==='pass')S.turn=1-p;else if(a==='var'){S.varBy=p}else if(a==='correct'||a==='wrong'){let punished=a==='correct'?S.varBy:1-S.varBy;S.hands[punished].push(...shuffle(D).slice(0,2));S.varBy=null}sync()}
window.pick=0;function play(i){if(S.turn!==(hostMode?0:1))return;window.pick=i;action('play')}
function drawUI(){if(!S)return;$('lobby').classList.add('hidden');$('game').classList.remove('hidden');let me=hostMode?0:1;$('players').innerHTML=S.hands.map((h,i)=>`<span class="pill">${i===0?'المضيف':'الصديق'}: ${h.length} بطاقات ${S.turn===i?'🟢':''}</span>`).join('');$('notice').textContent=S.winner?'🏆 فاز '+S.winner:S.turn===me?'دورك الآن':'انتظر دور صديقك';$('top').innerHTML=`<div class="card"><small>${S.top[2]}</small><span class="emoji">${S.top[1]}</span><b>${S.top[0]}</b></div>`;$('hand').innerHTML=S.hands[me].map((c,i)=>`<div class="card"><small>${c[2]}</small><span class="emoji">${c[1]}</span><b>${c[0]}</b><button onclick="play(${i})" ${S.turn!==me?'disabled':''}>العب</button></div>`).join('');$('var').classList.toggle('hidden',S.varBy===null)}
</script></html>
